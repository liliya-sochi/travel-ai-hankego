services:
  postgres:
    image: postgres:17
    container_name: hankego-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: hankego
      POSTGRES_PASSWORD: hankego_dev_password
      POSTGRES_DB: hankego

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - hankego_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U hankego -d hankego",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8.1-alpine
    container_name: hankego-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - hankego_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hankego_postgres_data:
  hankego_redis_data: