name: Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Check code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check code with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Check shell script syntax
        run: bash -n scripts/backup_postgres.sh

  pytest:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: hankego
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: hankego_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U hankego -d hankego_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.8.1-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LLM_BASE_URL: https://example.invalid
      LLM_API_KEY: test-api-key
      LLM_MODEL: test-model

      GEOAPIFY_BASE_URL: https://example.invalid
      GEOAPIFY_API_KEY: test-geoapify-api-key
      GEOAPIFY_TIMEOUT_SECONDS: 30

      TRAVEL_CONTEXT_CACHE_TTL_SECONDS: 21600
      
      TELEGRAM_BOT_TOKEN: test-telegram-token

      INTERNAL_API_KEY: test-internal-api-key-at-least-32-characters

      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/15

      TRIP_PLAN_RATE_LIMIT: 10
      TRIP_PLAN_RATE_WINDOW_SECONDS: 3600

      DATABASE_URL: postgresql+asyncpg://hankego:test-password@127.0.0.1:5432/hankego_test
      TEST_DATABASE_URL: postgresql+asyncpg://hankego:test-password@127.0.0.1:5432/hankego_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Check migration consistency
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest -q

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag hankego-app:ci .

      - name: Verify runtime image
        run: |
          test "$(docker image inspect hankego-app:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker run --rm --entrypoint id hankego-app:ci -u)" = "10001"
          test "$(docker run --rm --entrypoint id hankego-app:ci -un)" = "hankego"
          docker run --rm --entrypoint python hankego-app:ci \
            -c "import fastapi, gunicorn, uvicorn_worker"
