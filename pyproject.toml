[project]
name = "hankego"
version = "0.1.0"
description = "AI-powered travel platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Liliya" }
]
dependencies = [
    "aiogram>=3.29.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.0",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "redis[hiredis]>=8.0.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "uvicorn-worker>=0.4.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires a PostgreSQL test database",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "RUF",
]

ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"